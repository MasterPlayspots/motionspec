<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Audit fixture 1 — unguarded + infinite</title>
  <style>
    /* Check 1: animation with NO prefers-reduced-motion guard.
       Check 3: infinite animation with NO pause path.
       W2.2 (2026-09-11): the selector/keyframes are deliberately NOT loader-like
       (`.spinner`/`spin` is a loading indicator = WCAG 2.2.2 preload exception,
       reported as 'review' with no score impact). A decorative drifting hero
       background is a real Level-A candidate. */
    .hero {
      animation: drift 6s linear infinite;
    }
    @keyframes drift { from { transform: translateX(0) } to { transform: translateX(-50%) } }
  </style>
</head>
<body>
  <div class="hero">drifting background</div>
</body>
</html>
