<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Audit fixture 2 — non-transform prop + autoplay &gt;5s</title>
  <style>
    /* Check 2: animated NON-transform/opacity property (transition on `left`).
       W2.2 (2026-09-11): deliberately WITHOUT a reduced-motion guard — check 2
       only fires for unguarded motion transitions (a guarded one already
       satisfies C39 for reduced-motion users), so check 1 fires here as well. */
    .drawer { transition: left 0.4s ease; }
    /* Check 4: autoplaying animation running > 5s, no pause path. Inside a
       no-preference guard: guarded, but still a 2.2.2 candidate (half weight) —
       visitors without the OS setting get no pause control. */
    @media (prefers-reduced-motion: no-preference) {
      .hero-bg { animation: kenburns 20s ease-in-out; }
    }
    @keyframes kenburns { from { transform: scale(1) } to { transform: scale(1.2) } }
  </style>
</head>
<body>
  <aside class="drawer">menu</aside>
  <div class="hero-bg"></div>
</body>
</html>
